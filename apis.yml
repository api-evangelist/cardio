name: card.io
description: >-
  card.io was a mobile SDK company that provided fast, easy credit-card scanning
  inside iOS and Android apps using the device camera, letting users capture card
  details by holding a card up to the lens instead of typing them. Founded around
  2011 and backed by Uncork Capital (then SoftTech VC), card.io was acquired by
  PayPal in 2012. Its scanning SDKs for iOS, Android, Cordova, and React Native were
  open-sourced in December 2014 under the card-io GitHub organization, and the product
  was ultimately discontinued. The company operated no public REST or web API; its
  product surface was a set of client-side mobile SDKs, all of which are now archived.
  This profile is maintained for network completeness and historical/portfolio context.
